<div id="station-workspace-canon" class="viz-dotted-background" aria-label="Station workspace in the AetherSDR Canon window theme">
 <div class="sw-preview"><div class="sw-window" data-appearance="dark"></div></div>
</div>
<style>
#station-workspace-canon{padding:16px 0}
#station-workspace-canon .sw-preview{padding:8px}
#station-workspace-canon .sw-window{--sw-ground:#060b13;--sw-raised:#0a121e;--sw-nested:#0e1a2a;--sw-control:#12233a;--sw-ink:#eaf2fb;--sw-soft:#c4d4e8;--sw-muted:#8598b4;--sw-line:rgba(120,165,210,.12);--sw-line-hi:rgba(120,190,230,.28);--sw-cyan:#5de3ff;--sw-aqua:#8ef7e6;--sw-on:#041019;--sw-blue:#3aa7ff;--sw-warning:#efc67d;--sw-shadow:#00000045;--sw-grid:rgba(120,165,210,.035);--sw-bloom-blue:rgba(58,167,255,.16);--sw-bloom-teal:rgba(142,247,230,.10);color-scheme:dark;position:relative;overflow:hidden;background:var(--sw-ground);color:var(--sw-ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:1px solid var(--sw-line-hi);border-radius:16px;box-shadow:0 18px 40px var(--sw-shadow);min-height:570px}
#station-workspace-canon .sw-window[data-appearance=light]{--sw-ground:#f5f5f8;--sw-raised:#ffffff;--sw-nested:#dde5ed;--sw-control:#dde5ed;--sw-ink:#1a2a3a;--sw-soft:#344b62;--sw-muted:#506070;--sw-line:rgba(50,80,110,.14);--sw-line-hi:rgba(50,90,120,.32);--sw-cyan:#005080;--sw-aqua:#005080;--sw-on:#ffffff;--sw-blue:#005080;--sw-warning:#795000;--sw-shadow:#1a2a3a22;--sw-grid:rgba(50,80,110,.04);--sw-bloom-blue:rgba(0,136,176,.09);--sw-bloom-teal:rgba(0,152,192,.06);color-scheme:light}
#station-workspace-canon .sw-window:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 72% -8%,var(--sw-bloom-blue),transparent 62%),radial-gradient(ellipse at 12% 4%,var(--sw-bloom-teal),transparent 55%)}
#station-workspace-canon .sw-window:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--sw-grid) 1px,transparent 1px),linear-gradient(90deg,var(--sw-grid) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,currentColor,transparent 75%)}
#station-workspace-canon .sw-window *{box-sizing:border-box}
#station-workspace-canon .sw-header,#station-workspace-canon .sw-shell,#station-workspace-canon .sw-footer,#station-workspace-canon .sw-subview{position:relative;z-index:1}
#station-workspace-canon .sw-header{padding:18px 24px 0}
#station-workspace-canon .sw-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-right:40px;padding-bottom:13px;border-bottom:1px solid var(--sw-line)}
#station-workspace-canon h2{font-size:17px;font-weight:500;line-height:1.3;margin:0}
#station-workspace-canon h3{font-size:18px;line-height:1.3;font-weight:500;margin:0 0 5px}
#station-workspace-canon h4{font-size:14px;line-height:1.4;font-weight:500;margin:0 0 5px}
#station-workspace-canon p{margin:0 0 14px;color:var(--sw-soft)}
#station-workspace-canon .sw-caption{font-size:12px;color:var(--sw-muted)}
#station-workspace-canon button,#station-workspace-canon select,#station-workspace-canon input{font:inherit;font-size:12px;min-height:30px;border-radius:6px;padding:6px 9px;border:1px solid var(--sw-line-hi);background:var(--sw-control);color:var(--sw-soft);max-width:100%}
#station-workspace-canon button{cursor:var(--cursor-interaction,pointer)}
#station-workspace-canon button:hover{color:var(--sw-aqua);border-color:var(--sw-cyan)}
#station-workspace-canon button:disabled{cursor:default;opacity:.5}
#station-workspace-canon button.sw-primary{background:linear-gradient(100deg,var(--sw-blue),var(--sw-cyan),var(--sw-aqua));color:var(--sw-on);border:1px solid transparent;font-weight:500;min-height:35px}
#station-workspace-canon button.sw-close{position:absolute;right:12px;top:12px;width:26px;height:26px;min-height:26px;border-radius:13px;border-color:transparent;background:transparent;color:var(--sw-muted);padding:0;z-index:3}
#station-workspace-canon button.sw-close:hover{background:var(--sw-nested);border-color:var(--sw-line-hi);color:var(--sw-ink)}
#station-workspace-canon button.sw-link{background:transparent;border-color:transparent;color:var(--sw-cyan);padding-left:0;padding-right:0}
#station-workspace-canon .sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#station-workspace-canon .sw-shell{display:grid;grid-template-columns:113px minmax(0,1fr);min-height:435px;padding:18px 22px 18px 14px;gap:20px}
#station-workspace-canon .sw-nav{border-right:1px solid var(--sw-line);padding:0 12px 0 0}
#station-workspace-canon .sw-overline{font-size:11px;color:var(--sw-muted);letter-spacing:.9px;text-transform:uppercase;margin:0 0 10px}
#station-workspace-canon .sw-nav button{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:5px;background:transparent;border-color:transparent;text-align:left;min-height:35px;color:var(--sw-soft)}
#station-workspace-canon .sw-nav button[aria-pressed=true]{background:var(--sw-control);border-color:var(--sw-line-hi);color:var(--sw-cyan)}
#station-workspace-canon .sw-nav .sw-link{padding-left:9px;margin-top:12px;font-size:11px}
#station-workspace-canon .sw-stationhead{margin:3px 0 17px}
#station-workspace-canon .sw-stationhead .sw-caption{margin:4px 0 0}
#station-workspace-canon .sw-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px}
#station-workspace-canon .sw-radios{display:flex;flex-direction:column;gap:8px}
#station-workspace-canon .sw-radio{display:block;width:100%;background:var(--sw-raised);text-align:left;border:1px solid var(--sw-line);border-radius:10px;padding:11px 10px;font-size:13px}
#station-workspace-canon .sw-radio[aria-pressed=true]{background:var(--sw-nested);border-color:var(--sw-cyan)}
#station-workspace-canon .sw-radio .sw-radio-title{color:var(--sw-ink);font-size:13px;display:flex;align-items:center;gap:7px}
#station-workspace-canon .sw-selection{width:12px;height:12px;border:1px solid var(--sw-line-hi);border-radius:50%;display:inline-grid;place-items:center;flex-shrink:0}
#station-workspace-canon .sw-radio[aria-pressed=true] .sw-selection{border-color:var(--sw-cyan)}
#station-workspace-canon .sw-radio[aria-pressed=true] .sw-selection:after{content:"";width:6px;height:6px;background:var(--sw-cyan);border-radius:50%}
#station-workspace-canon .sw-radio small{display:block;color:var(--sw-muted);font-size:11px;margin:4px 0 0 19px}
#station-workspace-canon .sw-radio .sw-availability{color:var(--sw-soft);font-size:11px;display:flex;align-items:center;gap:5px;margin:7px 0 0 19px}
#station-workspace-canon .sw-dot{width:5px;height:5px;border-radius:50%;background:var(--sw-cyan);flex-shrink:0}
#station-workspace-canon .sw-warning{color:var(--sw-warning)}
#station-workspace-canon .sw-detail{background:var(--sw-nested);border:1px solid var(--sw-line);border-radius:12px;padding:15px;align-self:start;min-width:0}
#station-workspace-canon .sw-detail h4{color:var(--sw-ink)}
#station-workspace-canon .sw-detail dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 10px;margin:17px 0;font-size:11px}
#station-workspace-canon dt{color:var(--sw-muted)}#station-workspace-canon dd{margin:0;color:var(--sw-soft);overflow-wrap:anywhere}
#station-workspace-canon .sw-detail .sw-primary{width:100%;margin:12px 0 0}
#station-workspace-canon .sw-detail label{display:block;margin:12px 0 5px;color:var(--sw-muted);font-size:11px}
#station-workspace-canon .sw-detail select{width:100%}
#station-workspace-canon details{font-size:11px;margin-top:14px;color:var(--sw-soft)}
#station-workspace-canon summary{cursor:var(--cursor-interaction,pointer);color:var(--sw-cyan);padding:4px 0}
#station-workspace-canon .sw-result{font-size:11px;color:var(--sw-cyan);margin-top:10px;min-height:17px;overflow-wrap:anywhere}
#station-workspace-canon .sw-footer{margin:0 24px;padding:13px 0 16px;border-top:1px solid var(--sw-line)}
#station-workspace-canon .sw-footer select{margin-left:7px}
#station-workspace-canon .sw-subview{padding:20px 24px 25px;min-height:435px}
#station-workspace-canon .sw-panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
#station-workspace-canon .sw-inset{padding:14px 15px;background:var(--sw-nested);border:1px solid var(--sw-line);border-radius:12px;margin:10px 0}
#station-workspace-canon .sw-inset p{font-size:12px;color:var(--sw-muted);margin:5px 0 0}
#station-workspace-canon .sw-form{display:grid;gap:14px;margin:15px 0}
#station-workspace-canon .sw-form label{display:grid;gap:5px;color:var(--sw-muted);font-size:12px}
#station-workspace-canon .sw-form input,#station-workspace-canon .sw-form select{width:100%}
#station-workspace-canon .sw-context{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#station-workspace-canon .sw-closed{padding:75px 24px;text-align:center;position:relative;z-index:2}
@media(max-width:620px){#station-workspace-canon .sw-shell{grid-template-columns:1fr;padding:16px;gap:15px}#station-workspace-canon .sw-nav{display:flex;gap:5px;flex-wrap:wrap;border:0;padding:0 0 12px;border-bottom:1px solid var(--sw-line)}#station-workspace-canon .sw-nav button{width:auto;margin:0}#station-workspace-canon .sw-nav .sw-overline{display:none}#station-workspace-canon .sw-nav .sw-link{margin:0}#station-workspace-canon .sw-header{padding:18px 16px 0}#station-workspace-canon .sw-footer{margin:0 16px}#station-workspace-canon .sw-heading{padding-right:28px}#station-workspace-canon .sw-heading .sw-caption{display:none}}
@media(max-width:430px){#station-workspace-canon .sw-columns{grid-template-columns:1fr}#station-workspace-canon .sw-detail{margin-top:5px}#station-workspace-canon .sw-footer .sw-row{justify-content:flex-start}#station-workspace-canon .sw-preview{padding:2px}}
@media(pointer:coarse){#station-workspace-canon button,#station-workspace-canon select{min-height:42px}#station-workspace-canon input{font-size:16px;min-height:42px}#station-workspace-canon button.sw-close{min-height:26px}}
</style>
<script>
(() => {
 const root=document.getElementById('station-workspace-canon');
 const win=root.querySelector('.sw-window');
 const stations={
  Home:{caption:'3 radios · LAN, USB and SmartLink',radios:[
   {id:'flex8600',name:'Main radio',model:'FLEX-8600',status:'Ready on LAN',path:'Local network',account:'Personal',access:'LAN + SmartLink · Personal',routes:['Local network','SmartLink · Personal'],note:'Your saved Home connection.'},
   {id:'hl2',name:'Workbench',model:'Hermes-Lite 2',status:'Ready on LAN',path:'Local network',access:'Local network',routes:['Local network'],note:'Experimental support.'},
   {id:'rtl',name:'USB receiver',model:'RTL-SDR',status:'Ready on USB',path:'USB',access:'USB · Receive only',routes:['USB'],note:'Experimental · Receive only.'}
  ]},
  POTA:{caption:'2 radios · Portable connections',radios:[
   {id:'icom705',name:'Portable radio',model:'IC-705',status:'Saved connection',path:'Radio Wi-Fi',access:'Saved radio Wi-Fi address',routes:['Radio Wi-Fi'],note:'Early support · Availability checked on connect.'},
   {id:'hl2',name:'Portable HL2',model:'Hermes-Lite 2',status:'Saved connection',path:'Portable LAN',access:'Saved portable network',routes:['Portable LAN'],note:'Same HL2 as Home, with a separate connection setup.'}
  ]},
  Club:{caption:'2 radios · Shared station access',radios:[
   {id:'flex6600',name:'Club transceiver',model:'FLEX-6600',status:'Sign-in required',path:'SmartLink · Club',account:'Club',access:'SmartLink · Club',routes:['SmartLink · Club'],note:'Club account needs sign-in. Personal access stays available.'},
   {id:'anan',name:'Club receiver',model:'ANAN-G2',status:'Saved connection',path:'Club VPN',access:'Saved club VPN address',routes:['Club VPN'],note:'Experimental · Receive only · Requires club VPN.'}
  ]},
  Cabin:{caption:'1 radio · Remote station',radios:[
   {id:'flex6400',name:'Cabin radio',model:'FLEX-6400',status:'Available remotely',path:'SmartLink · Personal',account:'Personal',access:'SmartLink · Personal',routes:['SmartLink · Personal','Cabin VPN'],note:'Uses the same Personal account as Home.'}
  ]}
 };
 const known=window.openai?.widgetState?.modelContent||{};
 const state={station:stations[known.station]?known.station:'Home',user:known.operator==='Guest'?'Guest':'Pat',radio:'',view:'main',route:'',nearby:false};
 const design={appearance:'Dark'};
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function radio(){return stations[state.station].radios.find(r=>r.id===state.radio)||stations[state.station].radios[0];}
 function remember(){window.openai?.setWidgetState({modelContent:{design:'Station workspace · Canon theme',station:state.station,operator:state.user,radio:radio().id},privateContent:{appearance:design.appearance}})?.catch(()=>{});}
 function header(){return `<header class="sw-header"><div class="sw-heading"><h2>Connect to a Station</h2><span class="sw-caption">AetherSDR</span></div></header><button type="button" class="sw-close" data-action="close" aria-label="Close preview">✕</button>`;}
 function footer(){return `<footer class="sw-footer"><div class="sw-row"><label class="sw-caption">Operating as<select data-user aria-label="Operator profile">${Object.keys(operatorProfiles).map(name=>`<option ${state.user===name?'selected':''}>${esc(name)}</option>`).join('')}</select></label><button type="button" class="sw-link" data-action="accounts">SmartLink accounts · 2</button><button type="button" class="sw-link" data-action="profiles">Profiles</button></div></footer>`;}
 function row(r){const selected=radio().id===r.id;return `<button type="button" class="sw-radio" data-radio="${r.id}" aria-pressed="${selected}"><span class="sw-radio-title"><span class="sw-selection" aria-hidden="true"></span>${r.name}</span><small>${r.model}</small><span class="sw-availability ${r.status==='Sign-in required'?'sw-warning':''}">${r.status.startsWith('Ready')||r.status==='Available remotely'?'<span class="sw-dot" aria-hidden="true"></span>':''}${r.status}</span></button>`;}
 function detail(){const r=radio();return `<div class="sw-detail"><div class="sw-overline">${r.model}</div><h4>${r.name}</h4><dl><dt>Connection</dt><dd>${state.route||r.path}</dd>${r.account?`<dt>SmartLink</dt><dd>${r.account}</dd>`:''}<dt>Operator</dt><dd>${state.user}</dd></dl><p class="sw-caption">${r.note}</p><details><summary>Connection settings</summary>${r.routes.length>1?`<label for="sw-route">Connect using</label><select id="sw-route" data-route>${r.routes.map(r=>`<option ${state.route===r?'selected':''}>${r}</option>`).join('')}</select>`:''}${r.path==='USB'?'':`<label for="sw-link">Link preset</label><select id="sw-link"><option>Saved station preference</option><option>Standard</option><option>Low bandwidth</option></select>`}<p class="sw-caption" style="margin-top:10px">Settings saved for ${state.station}.</p></details><button type="button" class="sw-primary" data-action="connect">${r.status==='Sign-in required'?'Sign in to Club':'Connect'}</button><div class="sw-result" data-result role="status" aria-live="polite"></div></div>`;}
 function main(){return `<div class="sw-shell"><nav class="sw-nav" aria-label="Saved stations"><div class="sw-overline">Stations</div>${Object.keys(stations).map(s=>`<button type="button" data-station="${s}" aria-pressed="${s===state.station}">${s}</button>`).join('')}<button type="button" class="sw-link" data-action="addstation">+ Add station</button></nav><main><div class="sw-row sw-stationhead"><div><h3>${state.station}</h3><p class="sw-caption">${stations[state.station].caption}</p></div><button type="button" class="sw-link" data-action="editstation">Edit station</button></div><div class="sw-columns"><div><div class="sw-radios">${stations[state.station].radios.map(row).join('')}</div><div class="sw-context"><button type="button" class="sw-link" data-action="add">+ Add radio</button></div></div>${detail()}</div><div class="sw-context"><span class="sw-caption">Discovery active · LAN + USB</span><button type="button" class="sw-link" data-action="nearby">Nearby radios</button></div></main></div>`;}
 function panel(title,body){return `<section class="sw-subview"><div class="sw-panelhead"><h3>${title}</h3><button type="button" class="sw-link" data-action="back">Back to ${state.station}</button></div>${body}</section>`;}
 function accounts(){return panel('SmartLink accounts',`<p class="sw-caption">Accounts can be used by several stations. Each saved radio connection remembers its account.</p><div class="sw-inset"><div class="sw-row"><h4>Personal</h4><span class="sw-caption">Signed in</span></div><p>Home · FLEX-8600<br>Cabin · FLEX-6400</p><button type="button" class="sw-link" data-action="signout">Sign out of Personal</button></div><div class="sw-inset"><div class="sw-row"><h4>Club</h4><span class="sw-caption sw-warning">Sign-in required</span></div><p>Club · FLEX-6600</p><button type="button" data-action="signin">Sign in to Club</button></div><button type="button" class="sw-link" data-action="newaccount">+ Add SmartLink account</button><div class="sw-result" data-result role="status" aria-live="polite"></div>`);}
 const operatorProfiles={Pat:{audio:'Headset',layout:'Operating layout'},Guest:{audio:'Speakers',layout:'Listening layout'}};
 function profiles(){return panel('Operator profiles',`<p class="sw-caption">Choose your audio and workspace preferences. Your profile follows you between stations.</p>${Object.entries(operatorProfiles).map(([name,p])=>`<div class="sw-inset"><div class="sw-row"><div><h4>${esc(name)}</h4><p>${esc(p.audio)} · ${esc(p.layout)}</p></div><button type="button" data-select-profile="${esc(name)}" ${state.user===name?'disabled':''}>${state.user===name?'Current profile':'Use profile'}</button></div></div>`).join('')}<button type="button" class="sw-link" data-action="createprofile">+ Create operator profile</button><div class="sw-inset"><div class="sw-row"><h4>Station profiles</h4><button type="button" class="sw-link" data-action="addstation">+ Create station</button></div><p>Home · POTA · Club · Cabin<br>Station profiles save radio connections, access paths and linked accounts.</p></div><p class="sw-caption">Operator profiles do not change account permissions or recall radio-owned Global, TX or Mic profiles.</p>`);}
 function createProfile(){return panel('Create operator profile',`<p class="sw-caption">Save personal audio and workspace preferences for any station.</p><div class="sw-form"><label>Profile name<input data-profile-name placeholder="e.g. Pat portable" value="Pat portable"></label><label>Start from<select><option>Pat — current profile</option><option>Guest</option><option>App defaults</option></select></label><label>Audio setup<select data-profile-audio><option>USB headset</option><option>Speakers</option><option>System default</option></select></label><label>Workspace layout<select data-profile-layout><option>Compact operating layout</option><option>Operating layout</option><option>Listening layout</option></select></label></div><div class="sw-row"><span class="sw-caption">Available in Home, POTA, Club and Cabin</span><button type="button" class="sw-primary" data-action="createanduse">Create and use profile</button></div><p class="sw-caption" style="margin-top:15px">Accounts are linked separately. Credentials stay in the system keychain.</p><div class="sw-result" data-result role="status" aria-live="polite"></div>`);}
 function add(){return panel('Add a radio to '+state.station,`<div class="sw-form"><label>Radio family<select data-family aria-label="Radio family"><option>FlexRadio</option><option>Hermes-Lite 2</option><option>Icom (network)</option><option>ANAN-G2</option><option>RTL-SDR (USB)</option><option>Demo simulator</option></select></label><div data-family-fields></div></div><button type="button" class="sw-primary" data-action="saveconnection">Save connection</button><div class="sw-result" data-result role="status" aria-live="polite"></div>`);}
 function formFamily(){const fields=win.querySelector('[data-family-fields]');if(!fields)return;const f=win.querySelector('[data-family]').value;fields.innerHTML=f==='RTL-SDR (USB)'?'<label>USB device<select><option>Detected RTL-SDR · Sample receiver</option></select></label><p class="sw-caption">Experimental · Receive only · Requires an RTL-enabled build.</p>':f==='Demo simulator'?'<p class="sw-caption">Built-in simulator · No hardware · Cannot transmit.</p>':`<label>Connection name<input placeholder="Radio nickname"></label>${f==='FlexRadio'?'<div class="sw-inset"><button type="button" class="sw-link" data-action="accounts">Choose a SmartLink account</button><p>Or enter a LAN / VPN address below.</p></div>':''}<label>Network address<input placeholder="Radio IP or host name"></label>${f==='Icom (network)'?'<label>Radio username<input placeholder="Network username"></label><label>Radio password<input type="password" placeholder="System keychain"></label>':''}<p class="sw-caption">${f==='Icom (network)'?'Network credentials saved for this connection.':'Nearby radios can also be added from discovery.'}</p>`;}
 function nearby(){return panel('Nearby radios',`<p class="sw-caption">Discoveries remain visible until you choose a station for them.</p><div class="sw-inset"><div class="sw-row"><h4>FLEX-8600 · Main radio</h4><span class="sw-caption">Saved in Home</span></div><p>Discovered on LAN · Same radio as its SmartLink entry</p></div><div class="sw-inset"><div class="sw-row"><h4>Hermes-Lite 2</h4><span class="sw-caption">Saved in Home + POTA</span></div><p>Discovered on LAN · One physical radio, two saved setups</p></div><div class="sw-inset"><div class="sw-row"><h4>RTL-SDR · Sample receiver</h4><button type="button" data-action="adddiscovery">Add to ${state.station}</button></div><p>Detected on USB · Receive only</p></div><p class="sw-caption">KiwiSDR / Web-888 remain auxiliary receive sources in Antennas.</p><button type="button" class="sw-link" data-action="demo">Try AetherSDR Demo</button><div class="sw-result" data-result role="status" aria-live="polite"></div>`);}
 function render(){let content=state.view==='main'?main():state.view==='accounts'?accounts():state.view==='profiles'?profiles():state.view==='createprofile'?createProfile():state.view==='add'?add():state.view==='nearby'?nearby():'';if(state.view==='addstation'||state.view==='editstation')content=panel(state.view==='addstation'?'Add a station':'Edit '+state.station,`<div class="sw-form"><label>Station name<input value="${state.view==='addstation'?'':state.station}" placeholder="Home, POTA, Club, Cabin…"></label></div><p class="sw-caption">A station groups any mix of radios and saved access paths.</p><button type="button" class="sw-primary" data-action="savestation">Save station</button><div class="sw-result" data-result role="status" aria-live="polite"></div>`);if(state.view==='signin'||state.view==='newaccount')content=panel(state.view==='signin'?'Sign in to Club':'Add SmartLink account',`<div class="sw-form"><label>Account label<input placeholder="Personal or Club" value="${state.view==='signin'?'Club':''}"></label><label>Email<input type="email" placeholder="you@example.com"></label><label>Password<input type="password" placeholder="SmartLink password"></label></div><button type="button" class="sw-primary" data-action="mockauth">Sign in</button><p class="sw-caption" style="margin-top:12px">Design preview · Use sample details only.</p><div class="sw-result" data-result role="status" aria-live="polite"></div>`);win.innerHTML=header()+content+footer();if(state.view==='add')formFamily();win.dataset.appearance=design.appearance.toLowerCase();}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.station){state.station=b.dataset.station;state.radio='';state.route='';state.view='main';render();remember();return;}if(b.dataset.selectProfile){state.user=b.dataset.selectProfile;render();remember();return;}if(b.dataset.radio){state.radio=b.dataset.radio;state.route='';render();remember();return;}const a=b.dataset.action;if(a==='createanduse'){const name=win.querySelector('[data-profile-name]').value.trim();if(!name){win.querySelector('[data-result]').textContent='Enter a profile name.';return;}if(operatorProfiles[name]){win.querySelector('[data-result]').textContent='Choose a different profile name.';return;}operatorProfiles[name]={audio:win.querySelector('[data-profile-audio]').value,layout:win.querySelector('[data-profile-layout]').value};state.user=name;state.view='profiles';render();remember();return;}if(a==='close'){win.innerHTML='<div class="sw-closed"><h3>Station workspace</h3><p class="sw-caption">Design preview closed</p><button type="button" data-action="back">Reopen</button></div>';return;}if(a==='back'){state.view='main';render();return;}if(a==='switchuser'){state.user=state.user==='Pat'?'Guest':'Pat';render();remember();return;}if(['accounts','profiles','createprofile','add','nearby','addstation','editstation','signin','newaccount'].includes(a)){state.view=a;render();return;}if(a==='connect'){if(radio().status==='Sign-in required'){state.view='signin';render();return;}win.querySelector('[data-result]').textContent=`Preview: ${radio().name} via ${state.route||radio().path} · ${state.user}`;remember();return;}const messages={signout:'Preview: signs out Personal only. Club credentials stay saved.',mockauth:'Preview only · No credentials submitted.',saveconnection:'Preview: connection saved to '+state.station+'.',savestation:'Preview: station saved.',adddiscovery:'Preview: discovered receiver added to '+state.station+'.',demo:'Preview: simulator selected · Cannot transmit.'};if(messages[a])win.querySelector('[data-result]').textContent=messages[a];});
 root.addEventListener('change',e=>{if(e.target.matches('[data-user]')){state.user=e.target.value;render();remember();}if(e.target.matches('[data-route]')){state.route=e.target.value;const open=win.querySelector('details')?.open;render();const detail=win.querySelector('details');if(detail)detail.open=Boolean(open);remember();}if(e.target.matches('[data-family]'))formFamily();});
 window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(!s)return;if(stations[s.station])state.station=s.station;if(s.operator==='Pat'||s.operator==='Guest')state.user=s.operator;render();});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:win,onChange:()=>{win.dataset.appearance=design.appearance.toLowerCase();remember();}});tweak.addSelect(design,'appearance',{label:'Window theme',options:['Dark','Light']});}
})();
</script>
